name: Continuous Integration (Minimal)

on:
    pull_request:
        paths-ignore:
            - "adr/**"
            - "docs/**"
            - "*.md"
    push:

permissions:
    contents: read

jobs:
    static-checks:
        name: Static checks
        uses: ./.github/workflows/ci_static-checks.yaml
        with:
            type: minimal
    e2e-mysql:
        name: Tests (MySQL)
        needs: static-checks
        uses: ./.github/workflows/ci_e2e-mysql.yaml
        with:
            type: minimal
    packages:
        name: Packages
        needs: static-checks
        uses: ./.github/workflows/ci_packages.yaml
        with:
            type: minimal
